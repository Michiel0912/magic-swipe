AutoName: Magic Swipe
Summary: Make Android Back swipes easier to start from the screen edge
Description: |-
  Magic Swipe adds narrow transparent touch zones just inside Android's native
  Back-gesture edges. It is intended for phones where a protective case, raised
  side lip, or curved display makes the native edge swipe difficult to start.

  The app uses Android's AccessibilityService only to detect swipes inside its
  own edge overlay and trigger the system Back action. It does not retrieve
  screen content, contains no analytics, and requires no root access or system
  modification.

  Network access is limited to the optional update checker in the settings
  screen. Manual checks are always user initiated. Automatic GitHub update
  checks are disabled by default and require explicit informed consent. Before
  opening an APK download from GitHub, Magic Swipe warns that the download is
  outside F-Droid and bypasses F-Droid's build verification. The
  AccessibilityService itself never uses the network.

  Compatibility is currently confirmed on HONOR Magic8 Pro with MagicOS 10 /
  Android 16. Other HONOR and Android devices are expected or experimental until
  confirmed by real-device reports.

