AutoName: Magic Swipe
Summary: Make Android Back swipes easier to start from the screen edge
Description: |-
  Magic Swipe adds narrow transparent touch zones just inside Android's native
  Back-gesture edges. It is intended for phones where a protective case, raised
  side lip, or curved display makes the native edge swipe difficult to start.

  The app uses Android's AccessibilityService only to detect swipes inside its
  own edge overlay and trigger the system Back action. It does not retrieve
  screen content, does not use the network, contains no analytics, and requires
  no root access or system modification.

  Compatibility is currently confirmed only on HONOR Magic8 Pro with MagicOS 10
  / Android 16. Other HONOR and Android devices are expected or experimental
  until confirmed by real-device reports.

