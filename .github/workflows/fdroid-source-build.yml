name: F-Droid source build

on:
  push:
    branches:
      - fdroid-v0.4.1
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android API 36 and Build-Tools 36.0.0
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Build unsigned F-Droid APK
        run: |
          chmod +x fdroid/build.sh
          ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT" bash fdroid/build.sh

      - name: Verify package and version
        run: |
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging MagicSwipe-v0.4.1-unsigned.apk | head -n 1 | tee package.txt
          grep -q "package: name='be.michiel.edgeback' versionCode='9' versionName='0.4.1'" package.txt

      - name: SHA-256
        run: sha256sum MagicSwipe-v0.4.1-unsigned.apk

      - name: Upload unsigned APK
        uses: actions/upload-artifact@v4
        with:
          name: MagicSwipe-v0.4.1-unsigned
          path: MagicSwipe-v0.4.1-unsigned.apk
          if-no-files-found: error
